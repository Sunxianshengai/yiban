<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>忆伴 · 陪伴聊天（暖色版）预览</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../fonts/urbanist/fonts.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/noto-sans-sc/index.css">
<link rel="stylesheet" href="warm.css">
</head>
<body>
<div class="app-frame" role="application" aria-label="忆伴陪伴聊天暖色版预览">

  <nav class="rail" aria-label="应用导航">
    <a class="wordmark" href="#" aria-label="忆伴首页"><b>忆</b><span>yiban</span></a>
    <div class="rail-links">
      <button class="rail-active" aria-label="陪伴" aria-current="page"><i data-icon="MessagesSquare"></i><span>陪伴</span></button>
      <button aria-label="家庭记忆"><i data-icon="BookOpen"></i><span>记忆</span></button>
      <button aria-label="我的家庭"><i data-icon="Users"></i><span>我家</span></button>
    </div>
    <div class="rail-bottom">
      <button aria-label="切换主题"><i data-icon="SunMoon"></i></button>
      <button aria-label="设置"><i data-icon="Settings2"></i></button>
      <span class="rail-avatar" aria-hidden="true">我</span>
    </div>
  </nav>

  <aside class="contacts" aria-label="会话列表">
    <header>
      <div>
        <h1>陪伴</h1>
        <p>把今天，慢慢说给我听。</p>
      </div>
      <button class="icon-button" aria-label="新建对话"><i data-icon="SquarePen"></i></button>
    </header>

    <label class="contact-search"><i data-icon="Search"></i><input aria-label="搜索会话" placeholder="搜索伙伴或聊天内容"></label>

    <div class="contact-tabs" role="tablist">
      <button class="selected" role="tab" aria-selected="true">最近聊天</button>
      <button role="tab" aria-selected="false">历史会话</button>
    </div>

    <button class="contact selected">
      <span class="avatar xiaoman"><img src="../companion-im-preview/assets/xiaoman-sticker.png" alt="小满"></span>
      <span class="contact-text">
        <strong>小满<small>20:48</small></strong>
        <span>你先歇着，想说了再叫我。</span>
        <em>AI 伙伴</em>
      </span>
    </button>

    <button class="contact">
      <span class="avatar grandma">婆</span>
      <span class="contact-text">
        <strong>外婆<small>昨天</small></strong>
        <span>那年冬天，雪下得特别大。</span>
        <em>AI 家人</em>
      </span>
    </button>

    <button class="contact">
      <span class="avatar ai">检</span>
      <span class="contact-text">
        <strong>上线检查 AI<small>周一</small></strong>
        <span>系统自检完成，一切正常。</span>
        <em>系统</em>
      </span>
    </button>

    <button class="add-contact"><i data-icon="Plus"></i>添加一位 AI 家人</button>

    <footer>
      <div class="credits-pill"><i data-icon="Coins"></i>87 积分<em>查看明细</em></div>
      <div class="privacy-line"><i data-icon="LockKeyhole"></i>聊天与记忆仅自己可见</div>
      <p class="preview-tag">独立设计预览 · 演示人物与对话</p>
    </footer>
  </aside>

  <main class="conversation" aria-label="与小满的对话">
    <header class="chat-header">
      <button class="chat-person">
        <span class="avatar xiaoman"><img src="../companion-im-preview/assets/xiaoman-sticker.png" alt=""></span>
        <span>
          <strong>小满</strong>
          <small><span class="dot"></span>AI 伙伴 · 愿意听你说</small>
        </span>
      </button>
      <div class="header-actions">
        <button class="icon-button" aria-label="语音通话"><i data-icon="Phone"></i></button>
        <button class="icon-button" aria-label="更多"><i data-icon="Ellipsis"></i></button>
      </div>
    </header>

    <section class="chat-feed" aria-label="聊天记录">
      <div class="date-divider">今天 20:42</div>

      <article class="message user-message">
        <span class="avatar me">我</span>
        <div class="message-body"><div class="bubble">面试完回来了，比我想的顺利。</div></div>
      </article>

      <article class="message">
        <span class="avatar xiaoman"><img src="../companion-im-preview/assets/xiaoman-sticker.png" alt="小满"></span>
        <div class="message-body"><div class="bubble">昨晚背的开场白，用上没？</div></div>
      </article>

      <article class="message user-message">
        <span class="avatar me">我</span>
        <div class="message-body">
          <div class="bubble">没，直接让我讲项目。</div>
          <div class="bubble">先别复盘，我想歇会儿。</div>
        </div>
      </article>

      <article class="message">
        <span class="avatar xiaoman"><img src="../companion-im-preview/assets/xiaoman-sticker.png" alt="小满"></span>
        <div class="message-body">
          <div class="bubble">行，复盘大会取消。</div>
          <div class="sticker-message" aria-label="小满端着茶杯挥手"><img src="../companion-im-preview/assets/xiaoman-sticker.png" alt="小满捧着热茶向你挥手"></div>
          <div class="bubble">你先歇着，想说了再叫我。</div>
          <span class="msg-meta">20:48</span>
        </div>
      </article>

      <div class="moment"><i data-icon="Leaf"></i>小满记住了：今天面试顺利</div>
    </section>

    <div class="composer-area">
      <form class="composer">
        <div class="composer-tools">
          <button type="button" class="tool" aria-label="表情"><i data-icon="Smile"></i></button>
          <button type="button" class="tool" aria-label="添加图片"><i data-icon="Image"></i></button>
          <button type="button" class="tool" aria-label="语音"><i data-icon="Mic"></i></button>
          <button type="button" class="tool" aria-label="聊天记录"><i data-icon="History"></i></button>
        </div>
        <div class="compose-line">
          <textarea rows="1" aria-label="发送给小满的消息" placeholder="和小满说说话…"></textarea>
          <button type="submit" class="send-button" aria-label="发送"><i data-icon="ArrowUp"></i></button>
        </div>
        <div class="composer-foot">
          <span><i data-icon="LockKeyhole"></i>只属于这段聊天</span>
          <small>Enter 发送 · Shift + Enter 换行</small>
        </div>
      </form>
    </div>
  </main>
</div>

<div class="toast" role="status" hidden></div>
<script src="../companion-im-preview/icons.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const icon = name => (window.previewIcons[name] || window.previewIcons.Circle || '');
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });

  // 气泡配色变体：?bubble=sage（默认，站点鼠尾草绿）| ?bubble=clay（暖陶土）
  const bubble = new URLSearchParams(location.search).get('bubble');
  if (bubble === 'clay') document.documentElement.dataset.bubble = 'clay';

  // 演示交互：仅前端，不读取账号、不上传、不请求 AI。
  const toast = text => {
    const t = $('.toast'); t.textContent = text; t.hidden = false;
    clearTimeout(t._timer); t._timer = setTimeout(() => { t.hidden = true; }, 2200);
  };
  document.querySelectorAll('.rail-links button, .rail-bottom button, .icon-button, .tool, .add-contact, .contact-tabs button, .chat-person').forEach(el => {
    el.addEventListener('click', () => toast('设计预览：此按钮仅作视觉演示'));
  });
  document.querySelectorAll('.contact-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.contact-tabs button').forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-selected','false'); });
      btn.classList.add('selected'); btn.setAttribute('aria-selected','true');
    });
  });

  const area = $('.composer-area'), ta = area.querySelector('textarea');
  const autosize = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 132) + 'px'; };
  ta.addEventListener('input', autosize);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); area.querySelector('form').requestSubmit(); }
  });

  const feed = $('.chat-feed');
  area.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = ta.value.trim();
    if (!text) return;
    const el = document.createElement('article');
    el.className = 'message user-message';
    el.innerHTML = '<span class="avatar me">我</span><div class="message-body"><div class="bubble"></div></div>';
    el.querySelector('.bubble').textContent = text;
    feed.appendChild(el);
    ta.value = ''; autosize();
    feed.scrollTop = feed.scrollHeight;
    toast('预览中，消息不会真正发送');
  });

  feed.scrollTop = feed.scrollHeight;
})();
</script>
</body></html>
