<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>忆伴 · 陪伴聊天设计预览</title><link rel="stylesheet" href="/fonts/urbanist/fonts.css"><link rel="stylesheet" href="/node_modules/@fontsource-variable/noto-sans-sc/index.css"><link rel="stylesheet" href="preview.css"></head>
<body><div class="app-frame">
  <nav class="rail" aria-label="应用导航"><a class="wordmark" href="?screen=contacts">忆伴<span>yiban</span></a><div class="rail-links"><button data-go="contacts" class="rail-active" aria-label="陪伴"><i data-icon="MessagesSquare"></i><span>陪伴</span></button><button data-action="family" aria-label="家庭记忆"><i data-icon="BookOpen"></i><span>记忆</span></button><button data-action="family" aria-label="我的家庭"><i data-icon="Users"></i><span>我家</span></button></div><div class="rail-bottom"><button data-action="theme" aria-label="切换明暗主题"><i data-icon="SunMoon"></i></button><button data-go="details" aria-label="个人设置"><i data-icon="Settings2"></i></button><span class="avatar me-avatar">我</span></div></nav>
  <aside class="contacts" aria-label="最近聊天"><header><div><h1>陪伴</h1><span>把今天，慢慢说给我听。</span></div><button class="icon-button" data-action="new" aria-label="添加伙伴"><i data-icon="SquarePen"></i></button></header><label class="contact-search"><i data-icon="Search"></i><input aria-label="搜索聊天" placeholder="搜索伙伴或聊天内容"></label><div class="contact-tabs"><button class="selected" data-action="recent">最近聊天</button><button data-action="favorite">收藏</button></div>
    <button class="contact selected" data-go="chat"><span class="avatar xiaoman-avatar"><img src="assets/xiaoman-sticker.png" alt="原创小满演示头像"></span><span class="contact-text"><strong>小满<small>20:48</small></strong><span>你先歇着，想说了再叫我。</span><em>AI 伙伴</em></span></button>
    <button class="contact" data-action="other"><span class="avatar father-avatar">爸</span><span class="contact-text"><strong>爸爸<small>昨天</small></strong><span>你慢慢说，我听着呢。</span><em>AI 家人</em></span></button>
    <button class="contact" data-action="other"><span class="avatar letter-avatar">宁</span><span class="contact-text"><strong>阿宁<small>周日</small></strong><span>那首歌，我也很喜欢。</span><em>AI 伙伴</em></span></button>
    <button class="add-contact" data-action="new"><i data-icon="Plus" size="17"></i>添加一位伙伴</button><footer><div><i data-icon="LockKeyhole"></i>聊天和对你的了解，仅自己可见</div><span>独立设计预览 · 演示人物与对话</span></footer>
  </aside>
  <main class="conversation" aria-label="陪伴聊天"><header class="chat-header"><button class="mobile-back icon-button" data-go="contacts" aria-label="返回聊天列表"><i data-icon="ChevronLeft"></i></button><button class="chat-person" data-go="details"><span class="avatar xiaoman-avatar"><img src="assets/xiaoman-sticker.png" alt=""></span><span><strong>小满</strong><small>AI 伙伴 · 设计预览</small></span></button><div class="header-actions"><button class="icon-button desktop-theme" data-action="theme" aria-label="切换明暗主题"><i data-icon="SunMoon"></i></button><button class="icon-button" data-action="voice" aria-label="语音互动"><i data-icon="Phone"></i></button><button class="icon-button" data-go="details" aria-label="聊天详情"><i data-icon="Ellipsis"></i></button></div></header>
    <section class="chat-feed" aria-label="演示聊天消息"><div class="date-divider"><span>今天 20:42</span></div>
      <article class="message user-message"><span class="avatar me-avatar">我</span><div class="message-body"><button class="bubble" data-message="user">面试完回来了。<br>比我想的顺利。</button></div></article>
      <article class="message ai-message"><span class="avatar xiaoman-avatar"><img src="assets/xiaoman-sticker.png" alt="小满"></span><div class="message-body"><button class="bubble" data-message="ai">昨晚背的开场白，用上没？</button></div></article>
      <article class="message user-message"><span class="avatar me-avatar">我</span><div class="message-body"><button class="bubble" data-message="user">没，直接让我讲项目。</button><button class="bubble" data-message="user">先别复盘，我想歇会儿。</button></div></article>
      <article class="message ai-message"><span class="avatar xiaoman-avatar"><img src="assets/xiaoman-sticker.png" alt="小满"></span><div class="message-body"><button class="bubble" data-message="ai">开场白：那我走？</button><button class="bubble" data-message="ai">行，复盘大会取消。</button><button class="sticker-message" data-message="sticker" aria-label="小满端着茶杯，挥手打招呼的演示表情"><img src="assets/xiaoman-sticker.png" alt="小满捧着一杯热茶，向你挥挥手"></button><button class="bubble last-message" data-message="ai">你先歇着，想说了再叫我。</button></div></article>
      <div class="date-divider last-time"><span>20:48</span></div>
    </section>
    <div class="composer-area"><div class="reply-preview" hidden><span>回复小满</span><button aria-label="取消引用" data-action="cancel-reply"><i data-icon="X"></i></button><p>你先歇着，想说了再叫我。</p></div><form class="composer"><div class="desktop-composer-tools"><button type="button" class="icon-button" data-action="emoji" aria-label="表情"><i data-icon="Smile"></i></button><button type="button" class="icon-button" data-action="attach" aria-label="添加图片"><i data-icon="Image"></i></button><button type="button" class="icon-button" data-action="voice" aria-label="语音消息"><i data-icon="Mic"></i></button><button type="button" class="icon-button" data-go="history" aria-label="查找聊天记录"><i data-icon="History"></i></button></div><div class="compose-line"><button type="button" class="icon-button mobile-voice" data-action="voice" aria-label="语音消息"><i data-icon="Mic"></i></button><textarea rows="1" aria-label="发送给小满的消息" placeholder="和小满说说话…"></textarea><button type="button" class="icon-button mobile-emoji" data-action="emoji" aria-label="表情"><i data-icon="Smile"></i></button><button type="button" class="icon-button mobile-plus" data-action="attach" aria-label="更多消息功能"><i data-icon="CirclePlus"></i></button><button class="send-button" type="submit" aria-label="发送消息"><span>发送</span><i data-icon="ArrowUp"></i></button></div><div class="composer-foot"><span><i data-icon="LockKeyhole"></i>只属于这段聊天</span><small>Enter 发送 · Shift + Enter 换行</small></div></form><div class="mobile-home-indicator"></div></div>
  </main>
  <div class="panel-backdrop" data-go="chat"></div><aside class="detail-panel" aria-label="联系人详情"><header><button class="icon-button panel-back" data-go="chat" aria-label="返回聊天"><i data-icon="ChevronLeft"></i></button><strong class="panel-title">聊天详情</strong><button class="icon-button panel-close" data-go="chat" aria-label="关闭详情"><i data-icon="X"></i></button></header><div class="panel-content"></div></aside>
</div><div class="message-popover" role="dialog" aria-label="消息操作" hidden></div><div class="action-backdrop" hidden></div><div class="bottom-sheet" role="dialog" aria-label="扩展功能" hidden></div><div class="toast" role="status" hidden></div><script src="icons.js"></script><script src="preview.js"></script></body></html>
