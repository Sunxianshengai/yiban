<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- 木书架：三层板+书列+小盆栽 -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a97c50"/>
      <stop offset="0.5" stop-color="#c39a68"/>
      <stop offset="1" stop-color="#8f6439"/>
    </linearGradient>
    <pattern id="grain" width="7" height="14" patternUnits="userSpaceOnUse">
      <rect width="7" height="14" fill="none"/>
      <path d="M2 0 C3 5 1 9 3 14" stroke="#6b4e33" stroke-width="0.7" fill="none" opacity="0.35"/>
      <path d="M5 0 C4 6 6 10 5 14" stroke="#e0c89a" stroke-width="0.5" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="18" y="10" width="14" height="222" fill="url(#wood)"/>
  <rect x="168" y="10" width="14" height="222" fill="url(#wood)"/>
  <g fill="url(#wood)">
    <rect x="18" y="10" width="164" height="12" rx="2"/>
    <rect x="18" y="10" width="164" height="12" rx="2" fill="url(#grain)" opacity="0.5"/>
    <rect x="18" y="10" width="164" height="2" rx="1" fill="#ffe2b0" opacity="0.5"/>
    <rect x="18" y="82" width="164" height="10" rx="2"/>
    <rect x="18" y="154" width="164" height="10" rx="2"/>
    <rect x="18" y="226" width="164" height="8" rx="2"/>
  </g>
  <!-- 顶层书列 -->
  <g>
    <rect x="34" y="42" width="16" height="40" rx="2" fill="#b23a30"/>
    <rect x="52" y="46" width="14" height="36" rx="2" fill="#2c3648"/>
    <rect x="68" y="40" width="18" height="42" rx="2" fill="#c9962e"/>
    <rect x="88" y="48" width="14" height="34" rx="2" fill="#6e86a0"/>
    <rect x="110" y="30" width="30" height="52" rx="2" fill="#e3dac7" transform="skewX(-6)"/>
    <rect x="142" y="44" width="16" height="38" rx="2" fill="#3f6f74"/>
  </g>
  <!-- 中层：横书堆 + 摆件 -->
  <g>
    <rect x="34" y="66" width="52" height="8" rx="2" fill="#8d6f4e" transform="translate(0,8)"/>
    <rect x="36" y="66" width="50" height="8" rx="2" fill="#b23a30"/>
    <rect x="40" y="58" width="44" height="8" rx="2" fill="#2c3648"/>
    <circle cx="140" cy="66" r="12" fill="#7ba27b"/>
    <rect x="136" y="72" width="8" height="10" rx="2" fill="#c9b18a"/>
  </g>
  <!-- 底层书列 -->
  <g>
    <rect x="36" y="168" width="18" height="56" rx="2" fill="#3f6f74"/>
    <rect x="56" y="174" width="16" height="50" rx="2" fill="#c9962e"/>
    <rect x="74" y="170" width="20" height="54" rx="2" fill="#b23a30"/>
    <rect x="96" y="178" width="14" height="46" rx="2" fill="#2c3648"/>
    <rect x="118" y="172" width="16" height="52" rx="2" fill="#6e86a0"/>
    <rect x="138" y="176" width="18" height="48" rx="2" fill="#e3dac7"/>
  </g>
  <rect x="14" y="232" width="172" height="6" rx="3" fill="#7c5836"/>
</svg>
