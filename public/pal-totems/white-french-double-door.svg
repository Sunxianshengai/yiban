<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340">
  <!-- 法式双开门：外框套+每扇3×4玻璃格+黄铜杠杆把手+铰链（对齐原版白框铜件） -->
  <defs>
    <linearGradient id="df" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="0.5" stop-color="#f2f0ea"/>
      <stop offset="1" stop-color="#e2ded2"/>
    </linearGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f8"/>
      <stop offset="1" stop-color="#e6edef"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b465"/>
      <stop offset="0.5" stop-color="#a97f3a"/>
      <stop offset="1" stop-color="#7d5c26"/>
    </linearGradient>
    <filter id="dsh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#33414a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#dsh)">
    <!-- 外框套 -->
    <rect x="6" y="6" width="228" height="328" rx="4" fill="url(#df)" stroke="#d4cec0" stroke-width="2"/>
    <rect x="16" y="14" width="208" height="312" fill="#ffffff" opacity="0.5"/>
    <!-- 两扇门 -->
    <rect x="22" y="20" width="97" height="300" fill="url(#df)" stroke="#d8d2c4" stroke-width="1.6"/>
    <rect x="121" y="20" width="97" height="300" fill="url(#df)" stroke="#d8d2c4" stroke-width="1.6"/>
    <!-- 玻璃格：每扇 3 列 × 4 行 -->
    <g fill="url(#dg)" stroke="#c9c2b2" stroke-width="1">
      <rect x="30" y="30" width="24" height="60"/><rect x="59" y="30" width="24" height="60"/><rect x="88" y="30" width="23" height="60"/>
      <rect x="30" y="103" width="24" height="60"/><rect x="59" y="103" width="24" height="60"/><rect x="88" y="103" width="23" height="60"/>
      <rect x="30" y="176" width="24" height="60"/><rect x="59" y="176" width="24" height="60"/><rect x="88" y="176" width="23" height="60"/>
      <rect x="30" y="249" width="24" height="60"/><rect x="59" y="249" width="24" height="60"/><rect x="88" y="249" width="23" height="60"/>
      <rect x="129" y="30" width="23" height="60"/><rect x="157" y="30" width="24" height="60"/><rect x="186" y="30" width="24" height="60"/>
      <rect x="129" y="103" width="23" height="60"/><rect x="157" y="103" width="24" height="60"/><rect x="186" y="103" width="24" height="60"/>
      <rect x="129" y="176" width="23" height="60"/><rect x="157" y="176" width="24" height="60"/><rect x="186" y="176" width="24" height="60"/>
      <rect x="129" y="249" width="23" height="60"/><rect x="157" y="249" width="24" height="60"/><rect x="186" y="249" width="24" height="60"/>
    </g>
    <!-- 玻璃反光（每扇一条斜带） -->
    <path d="M30 90 L54 30 L62 30 L38 90 Z" fill="#ffffff" opacity="0.3"/>
    <path d="M129 90 L153 30 L161 30 L137 90 Z" fill="#ffffff" opacity="0.3"/>
    <!-- 中缝（双扇合线） -->
    <line x1="120" y1="20" x2="120" y2="320" stroke="#cfc8b9" stroke-width="2"/>
    <!-- 黄铜把手（门中高度） -->
    <g>
      <circle cx="112" cy="170" r="6" fill="url(#brass)"/>
      <rect x="86" y="167.5" width="24" height="5" rx="2.5" fill="url(#brass)"/>
      <rect x="86" y="167.5" width="24" height="2" rx="1" fill="#e6cd8d" opacity="0.8"/>
      <circle cx="128" cy="170" r="6" fill="url(#brass)"/>
      <rect x="130" y="167.5" width="24" height="5" rx="2.5" fill="url(#brass)"/>
      <rect x="130" y="167.5" width="24" height="2" rx="1" fill="#e6cd8d" opacity="0.8"/>
    </g>
    <!-- 铰链（左右门框外侧 ×3） -->
    <g fill="url(#brass)">
      <rect x="20" y="46" width="5" height="18" rx="2"/>
      <rect x="20" y="160" width="5" height="18" rx="2"/>
      <rect x="20" y="274" width="5" height="18" rx="2"/>
      <rect x="215" y="46" width="5" height="18" rx="2"/>
      <rect x="215" y="160" width="5" height="18" rx="2"/>
      <rect x="215" y="274" width="5" height="18" rx="2"/>
    </g>
    <!-- 底槛阴影 -->
    <rect x="6" y="332" width="228" height="5" rx="2" fill="#c9c3b5" opacity="0.7"/>
  </g>
</svg>
