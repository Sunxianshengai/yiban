<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice">
  <!-- sakura：完整房间场景 v2（墙面板缝/墙角 AO/踢脚线分段+插座/拼板错缝/木纹/节疤），光照与家具呼应 -->
  <style>
    .st { animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .rain { animation: fall 1.6s linear infinite; }
    @keyframes fall { 0% { transform: translateY(-140px); } 100% { transform: translateY(0); } }
    .pt { animation: petal 8s linear infinite; }
    .pt.p2 { animation-duration: 10s; animation-delay: 2.6s; }
    .pt.p3 { animation-duration: 9s; animation-delay: 5s; }
    @keyframes petal { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translate(-60px, 420px) rotate(300deg); opacity: 0; } }
    .mist1 { animation: mbreath 9s ease-in-out infinite alternate; }
    .mist2 { animation: mbreath 12s ease-in-out infinite alternate; animation-delay: 2s; }
    @keyframes mbreath { 0% { opacity: 0.5; } 100% { opacity: 0.85; } }
  </style>
  <defs>
    <linearGradient id="wp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeef2"/><stop offset="1" stop-color="#fbd3df"/>
    </linearGradient>
    <linearGradient id="wallGlow" x1="0" y1="0" x2="0" y2="1">
      
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.02"/>
      
    </linearGradient>
    <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#a67f78" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="395" fill="url(#wp)"/>
  <path d="M-10 60 C120 90 240 60 330 120 C280 96 200 92 140 110 C90 124 30 96 -10 84 Z" fill="#9c6b5a"/>
      <g fill="#f7b1c8"><circle cx="120" cy="92" r="12"/><circle cx="150" cy="76" r="10"/><circle cx="176" cy="96" r="13"/><circle cx="242" cy="84" r="11"/><circle cx="268" cy="104" r="9"/><circle cx="300" cy="124" r="12"/><circle cx="90" cy="70" r="9"/></g>
      <g fill="#fce0ea"><circle cx="132" cy="84" r="6"/><circle cx="164" cy="88" r="5.4"/><circle cx="254" cy="92" r="6"/><circle cx="290" cy="118" r="5.4"/></g>
      <g class="pt"><path d="M400 30 C392 20 396 8 406 6 C412 16 410 26 400 30 Z" fill="#f7b1c8"/></g>
      <g class="pt p2"><path d="M560 20 C552 10 556 -2 566 -4 C572 6 570 16 560 20 Z" fill="#f9c3d4"/></g>
      <g class="pt p3"><path d="M300 10 C292 0 296 -12 306 -14 C312 -4 310 6 300 10 Z" fill="#f7b1c8"/></g>
  <!-- 墙面板接缝 + 两侧墙角 AO -->
  <line x1="160" y1="0" x2="160" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="320" y1="0" x2="320" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="480" y1="0" x2="480" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="640" y1="0" x2="640" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
  
  
  <rect width="800" height="395" fill="url(#wallGlow)"/>
  <!-- 墙脚 AO -->
  
  <!-- 踢脚线（分段缝+插座） -->
  <rect y="388" width="800" height="18" fill="#fff5f0"/>
  <rect y="388" width="800" height="3" fill="#ffffff"/>
  <line x1="200" y1="391" x2="200" y2="403" stroke="#dcc2ba" stroke-width="1.6"/>
    <line x1="400" y1="391" x2="400" y2="403" stroke="#dcc2ba" stroke-width="1.6"/>
    <line x1="600" y1="391" x2="600" y2="403" stroke="#dcc2ba" stroke-width="1.6"/>
  <rect y="403" width="800" height="3" fill="#dcc2ba"/>
  <g>
      <rect x="648" y="392" width="14" height="11" rx="2" fill="#ffffff" stroke="#dcc2ba" stroke-width="1"/>
      <circle cx="652.6" cy="397.5" r="1.5" fill="#cdb0a8"/>
      <circle cx="657.4" cy="397.5" r="1.5" fill="#cdb0a8"/>
    </g>
  <!-- 地板：拼板线 + 行错缝 + 木纹 + 节疤 + 前缘压暗 -->
  <rect y="406" width="800" height="114" fill="#ecd2cb"/>
  <g><line x1="130" y1="406" x2="130" y2="520" stroke="#d8b8b0" stroke-width="2.4"/>
    <line x1="268" y1="406" x2="268" y2="520" stroke="#d8b8b0" stroke-width="2.4"/>
    <line x1="406" y1="406" x2="406" y2="520" stroke="#d8b8b0" stroke-width="2.4"/>
    <line x1="544" y1="406" x2="544" y2="520" stroke="#d8b8b0" stroke-width="2.4"/>
    <line x1="682" y1="406" x2="682" y2="520" stroke="#d8b8b0" stroke-width="2.4"/></g>
  <g><line x1="200" y1="470" x2="200" y2="348" stroke="#d8b8b0" stroke-width="2"/>
    <line x1="336" y1="412" x2="336" y2="492" stroke="#d8b8b0" stroke-width="2"/>
    <line x1="612" y1="430" x2="612" y2="508" stroke="#d8b8b0" stroke-width="2"/></g>
  <g><path d="M170 412 C164 436 176 458 170 480" stroke="#c9a8a0" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M308 412 C302 436 314 458 308 480" stroke="#c9a8a0" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M446 412 C440 436 452 458 446 480" stroke="#c9a8a0" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M584 412 C578 436 590 458 584 480" stroke="#c9a8a0" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M722 412 C716 436 728 458 722 480" stroke="#c9a8a0" stroke-width="1" fill="none" opacity="0.55"/></g>
  <g><ellipse cx="168" cy="436" rx="7" ry="4.4" fill="#c0a098" opacity="0.6"/>
    <ellipse cx="168" cy="436" rx="3.4" ry="2" fill="#c0a098" opacity="0.8"/>
    <ellipse cx="306" cy="486" rx="7" ry="4.4" fill="#c0a098" opacity="0.6"/>
    <ellipse cx="306" cy="486" rx="3.4" ry="2" fill="#c0a098" opacity="0.8"/>
    <ellipse cx="578" cy="448" rx="7" ry="4.4" fill="#c0a098" opacity="0.6"/>
    <ellipse cx="578" cy="448" rx="3.4" ry="2" fill="#c0a098" opacity="0.8"/></g>
  <rect y="462" width="800" height="2.4" fill="#e0c2ba"/>
  <rect y="406" width="800" height="114" fill="url(#floorShade)"/>
</svg>
