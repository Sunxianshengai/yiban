<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice">
  <!-- rain-fall：完整房间场景（墙面+踢脚线+地板），光照与家具（左上主光）呼应 -->
  <style>
    .st { animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .rain { animation: fall 1.6s linear infinite; }
    @keyframes fall { 0% { transform: translateY(-140px); } 100% { transform: translateY(0); } }
    .pt { animation: petal 8s linear infinite; }
    .pt.p2 { animation-duration: 10s; animation-delay: 2.6s; }
    .pt.p3 { animation-duration: 9s; animation-delay: 5s; }
    @keyframes petal { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translate(-60px, 420px) rotate(300deg); opacity: 0; } }
    .mist1 { animation: mbreath 9s ease-in-out infinite alternate; }
    .mist2 { animation: mbreath 12s ease-in-out infinite alternate; animation-delay: 2s; }
    @keyframes mbreath { 0% { opacity: 0.5; } 100% { opacity: 0.85; } }
  </style>
  <defs>
    <linearGradient id="wp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bccb"/><stop offset="1" stop-color="#7e94a7"/>
    </linearGradient>
    <linearGradient id="wallGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#54687a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="395" fill="url(#wp)"/>
  <g fill="#8ba0b2" opacity="0.85"><ellipse cx="180" cy="70" rx="180" ry="24"/><ellipse cx="420" cy="52" rx="150" ry="20"/><ellipse cx="640" cy="80" rx="190" ry="22"/></g>
      <g class="rain" stroke="#d8e5ee" stroke-width="2" stroke-linecap="round" opacity="0.7"><line x1="30" y1="90" x2="22" y2="126"/><line x1="150" y1="120" x2="142" y2="156"/><line x1="270" y1="100" x2="262" y2="136"/><line x1="390" y1="140" x2="382" y2="176"/><line x1="510" y1="110" x2="502" y2="146"/><line x1="630" y1="130" x2="622" y2="166"/><line x1="750" y1="110" x2="742" y2="146"/></g>
  <rect width="800" height="395" fill="url(#wallGlow)"/>
  <!-- 墙脚 AO -->
  <rect y="368" width="800" height="20" fill="#0a1420" opacity="0.10"/>
  <!-- 踢脚线 -->
  <rect y="388" width="800" height="18" fill="#e8eef2"/>
  <rect y="388" width="800" height="3" fill="#ffffff"/>
  <rect y="403" width="800" height="3" fill="#b5c2cd"/>
  <!-- 地板（拼板线+横向接缝+前缘压暗） -->
  <rect y="406" width="800" height="114" fill="#8fa3b2"/>
  <g><line x1="130" y1="406" x2="130" y2="520" stroke="#7e93a4" stroke-width="2.4"/>
  <line x1="268" y1="406" x2="268" y2="520" stroke="#7e93a4" stroke-width="2.4"/>
  <line x1="406" y1="406" x2="406" y2="520" stroke="#7e93a4" stroke-width="2.4"/>
  <line x1="544" y1="406" x2="544" y2="520" stroke="#7e93a4" stroke-width="2.4"/>
  <line x1="682" y1="406" x2="682" y2="520" stroke="#7e93a4" stroke-width="2.4"/></g>
  <rect y="462" width="800" height="2.4" fill="#879cac"/>
  <rect y="406" width="800" height="114" fill="url(#floorShade)"/>
</svg>
