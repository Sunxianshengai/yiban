<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice">
  <!-- dusk-glow：完整房间场景 v2（墙面板缝/墙角 AO/踢脚线分段+插座/拼板错缝/木纹/节疤），光照与家具呼应 -->
  <style>
    .st { animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .rain { animation: fall 1.6s linear infinite; }
    @keyframes fall { 0% { transform: translateY(-140px); } 100% { transform: translateY(0); } }
    .pt { animation: petal 8s linear infinite; }
    .pt.p2 { animation-duration: 10s; animation-delay: 2.6s; }
    .pt.p3 { animation-duration: 9s; animation-delay: 5s; }
    @keyframes petal { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translate(-60px, 420px) rotate(300deg); opacity: 0; } }
    .mist1 { animation: mbreath 9s ease-in-out infinite alternate; }
    .mist2 { animation: mbreath 12s ease-in-out infinite alternate; animation-delay: 2s; }
    @keyframes mbreath { 0% { opacity: 0.5; } 100% { opacity: 0.85; } }
  </style>
  <defs>
    <linearGradient id="wp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3b8"/><stop offset="0.55" stop-color="#f9b9ad"/><stop offset="1" stop-color="#b49ac0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3cf" stop-opacity="0.95"/><stop offset="0.55" stop-color="#ffdf9e" stop-opacity="0.55"/><stop offset="1" stop-color="#ffdf9e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420" stop-opacity="0.06"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#5e4838" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="395" fill="url(#wp)"/>
  <circle cx="560" cy="300" r="130" fill="url(#sun)"/><circle cx="560" cy="314" r="40" fill="#ffedb8" opacity="0.92"/>
      <g fill="#ffffff" opacity="0.5"><ellipse cx="150" cy="110" rx="120" ry="20"/><ellipse cx="260" cy="92" rx="80" ry="14"/></g>
      <g fill="#ffffff" opacity="0.35"><ellipse cx="520" cy="190" rx="140" ry="16"/><ellipse cx="640" cy="174" rx="70" ry="12"/></g>
  <!-- 墙面板接缝 + 两侧墙角 AO -->
  <line x1="160" y1="0" x2="160" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="320" y1="0" x2="320" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="480" y1="0" x2="480" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="640" y1="0" x2="640" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
  <rect width="16" height="388" fill="#0a1420" opacity="0.06"/>
  <rect x="784" width="16" height="388" fill="#0a1420" opacity="0.06"/>
  <rect width="800" height="395" fill="url(#wallGlow)"/>
  <!-- 墙脚 AO -->
  <rect y="368" width="800" height="20" fill="#0a1420" opacity="0.07"/>
  <!-- 踢脚线（分段缝+插座） -->
  <rect y="388" width="800" height="18" fill="#4a3d5c"/>
  <rect y="388" width="800" height="3" fill="#6b5a80"/>
  <line x1="200" y1="391" x2="200" y2="403" stroke="#332a44" stroke-width="1.6"/>
    <line x1="400" y1="391" x2="400" y2="403" stroke="#332a44" stroke-width="1.6"/>
    <line x1="600" y1="391" x2="600" y2="403" stroke="#332a44" stroke-width="1.6"/>
  <rect y="403" width="800" height="3" fill="#332a44"/>
  <g>
      <rect x="648" y="392" width="14" height="11" rx="2" fill="#6b5a80" stroke="#332a44" stroke-width="1"/>
      <circle cx="652.6" cy="397.5" r="1.5" fill="#514360"/>
      <circle cx="657.4" cy="397.5" r="1.5" fill="#514360"/>
    </g>
  <!-- 地板：拼板线 + 行错缝 + 木纹 + 节疤 + 前缘压暗 -->
  <rect y="406" width="800" height="114" fill="#9a7a5e"/>
  <g><line x1="130" y1="406" x2="130" y2="520" stroke="#82644c" stroke-width="2.4"/>
    <line x1="268" y1="406" x2="268" y2="520" stroke="#82644c" stroke-width="2.4"/>
    <line x1="406" y1="406" x2="406" y2="520" stroke="#82644c" stroke-width="2.4"/>
    <line x1="544" y1="406" x2="544" y2="520" stroke="#82644c" stroke-width="2.4"/>
    <line x1="682" y1="406" x2="682" y2="520" stroke="#82644c" stroke-width="2.4"/></g>
  <g><line x1="200" y1="470" x2="200" y2="348" stroke="#82644c" stroke-width="2"/>
    <line x1="336" y1="412" x2="336" y2="492" stroke="#82644c" stroke-width="2"/>
    <line x1="612" y1="430" x2="612" y2="508" stroke="#82644c" stroke-width="2"/></g>
  <g><path d="M170 412 C164 436 176 458 170 480" stroke="#6e5640" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M308 412 C302 436 314 458 308 480" stroke="#6e5640" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M446 412 C440 436 452 458 446 480" stroke="#6e5640" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M584 412 C578 436 590 458 584 480" stroke="#6e5640" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M722 412 C716 436 728 458 722 480" stroke="#6e5640" stroke-width="1" fill="none" opacity="0.55"/></g>
  <g><ellipse cx="168" cy="436" rx="7" ry="4.4" fill="#71563e" opacity="0.6"/>
    <ellipse cx="168" cy="436" rx="3.4" ry="2" fill="#71563e" opacity="0.8"/>
    <ellipse cx="306" cy="486" rx="7" ry="4.4" fill="#71563e" opacity="0.6"/>
    <ellipse cx="306" cy="486" rx="3.4" ry="2" fill="#71563e" opacity="0.8"/>
    <ellipse cx="578" cy="448" rx="7" ry="4.4" fill="#71563e" opacity="0.6"/>
    <ellipse cx="578" cy="448" rx="3.4" ry="2" fill="#71563e" opacity="0.8"/></g>
  <rect y="462" width="800" height="2.4" fill="#8d6e52"/>
  <rect y="406" width="800" height="114" fill="url(#floorShade)"/>
</svg>
