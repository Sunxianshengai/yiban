<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220">
  <!-- 鸟笼：黄鸟栖杠轻跳，逗它出声 -->
  <style>
    .bird { animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%, 60%, 100% { transform: translate(0, 0); } 70% { transform: translate(0, -5px); } 80% { transform: translate(0, 0); } 90% { transform: translate(0, -3px); } }
  </style>
  <defs>
    <linearGradient id="cage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9b465"/>
      <stop offset="0.5" stop-color="#b8934a"/>
      <stop offset="1" stop-color="#8d6c30"/>
    </linearGradient>
  </defs>
  <circle cx="70" cy="12" r="7" fill="none" stroke="url(#cage)" stroke-width="4"/>
  <path d="M70 20 C40 30 24 60 24 110 L24 170 L116 170 L116 110 C116 60 100 30 70 20 Z" fill="#fdf6e4" opacity="0.25"/>
  <path d="M70 24 C46 34 30 62 28 108 L44 108 C46 66 58 40 76 26 Z" fill="#ffffff" opacity="0.14"/>
  <g stroke="url(#cage)" stroke-width="3" fill="none">
    <path d="M36 58 C30 96 30 140 32 168"/>
    <path d="M53 40 C48 90 48 140 50 168"/>
    <path d="M70 34 L70 168"/>
    <path d="M87 40 C92 90 92 140 90 168"/>
    <path d="M104 58 C110 96 110 140 108 168"/>
  </g>
  <rect x="30" y="128" width="80" height="6" rx="3" fill="url(#cage)"/>
  <!-- 小鸟（栖杠上） -->
  <g class="bird">
    <ellipse cx="70" cy="112" rx="16" ry="12" fill="#f2c34e"/>
    <ellipse cx="64" cy="106" rx="6" ry="4" fill="#ffe08a" opacity="0.7"/>
    <circle cx="82" cy="102" r="9" fill="#f6d476"/>
    <path d="M90 102 L98 105 L90 108 Z" fill="#e0912f"/>
    <circle cx="84" cy="100" r="1.6" fill="#4c3a18"/>
    <path d="M60 108 C52 104 50 96 56 92 C58 100 62 106 66 110 Z" fill="#e0a93a"/>
    <line x1="66" y1="123" x2="66" y2="130" stroke="#c98a3a" stroke-width="2"/>
    <line x1="74" y1="123" x2="74" y2="130" stroke="#c98a3a" stroke-width="2"/>
  </g>
  <rect x="22" y="168" width="96" height="10" rx="4" fill="url(#cage)"/>
  <rect x="30" y="178" width="80" height="26" rx="6" fill="url(#cage)"/>
  <rect x="34" y="182" width="72" height="18" rx="4" fill="#b8934a" opacity="0.6"/>
</svg>
