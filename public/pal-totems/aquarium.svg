<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <!-- 鱼缸（原版 fish-food 动作的对应功能）：三条鱼游动 + 气泡上升（SVG 内 CSS 动画，<img> 亦生效） -->
  <style>
    .f1 { animation: swim1 7s ease-in-out infinite alternate; }
    .f2 { animation: swim2 9s ease-in-out infinite alternate; }
    .f3 { animation: swim3 8s ease-in-out infinite alternate; }
    .bub { animation: rise 3.2s linear infinite; }
    .bub.b2 { animation-delay: 1.1s; }
    .bub.b3 { animation-delay: 2.2s; }
    @keyframes swim1 { 0% { transform: translate(52px, 46px); } 100% { transform: translate(120px, 38px) scaleX(-1); } }
    @keyframes swim2 { 0% { transform: translate(118px, 78px) scaleX(-1); } 100% { transform: translate(52px, 70px); } }
    @keyframes swim3 { 0% { transform: translate(70px, 96px); } 100% { transform: translate(128px, 92px) scaleX(-1); } }
    @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 0.9; } 100% { transform: translate(6px, -70px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ef" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8fc6dc" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.2" stop-color="#dceef5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a9cfdd" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- 缸体 -->
  <rect x="8" y="8" width="184" height="128" rx="10" fill="url(#water)"/>
  <path d="M14 118 Q80 112 186 118 L186 122 Q100 128 14 122 Z" fill="#dceee6" opacity="0.5"/>
  <path d="M14 122 Q60 128 100 122 Q150 116 186 122 L186 128 Q100 136 14 128 Z" fill="#e0cfa8"/>
  <ellipse cx="100" cy="124" rx="88" ry="6" fill="#3c5058" opacity="0.35"/>
  <g fill="#c4ae82">
    <ellipse cx="34" cy="122" rx="7" ry="3"/><ellipse cx="58" cy="124" rx="6" ry="2.6"/><ellipse cx="86" cy="122" rx="7" ry="3"/>
    <ellipse cx="116" cy="124" rx="6" ry="2.6"/><ellipse cx="146" cy="122" rx="7" ry="3"/><ellipse cx="170" cy="124" rx="5" ry="2.4"/>
  </g>
  <!-- 水草 -->
  <g stroke="#4e8a46" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M28 118 C24 100 30 88 26 74"/>
    <path d="M34 118 C38 98 32 90 38 78"/>
    <path d="M172 118 C176 100 170 88 176 76"/>
  </g>
  <!-- 鱼（原点画一条朝左的小鱼，动画负责游动/转向） -->
  <g class="f1">
    <ellipse cx="0" cy="0" rx="11" ry="6" fill="#f28c3b"/>
    <path d="M10 0 L19 -6 L19 6 Z" fill="#d96f26"/>
    <circle cx="-6" cy="-1.5" r="1.3" fill="#3a2a18"/>
  </g>
  <g class="f2">
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#5aa7c9"/>
    <path d="M8 0 L16 -5 L16 5 Z" fill="#4285a8"/>
    <circle cx="-5" cy="-1.2" r="1.1" fill="#22343f"/>
  </g>
  <g class="f3">
    <ellipse cx="0" cy="0" rx="8" ry="4.6" fill="#e3b83c"/>
    <path d="M7 0 L14 -4.5 L14 4.5 Z" fill="#c49b25"/>
    <circle cx="-4.5" cy="-1.2" r="1" fill="#3a2a18"/>
  </g>
  <!-- 气泡 -->
  <g fill="#ffffff" opacity="0.7">
    <circle class="bub" cx="160" cy="112" r="3"/>
    <circle class="bub b2" cx="20" cy="112" r="2.4"/>
    <circle class="bub b3" cx="90" cy="114" r="2"/>
  </g>
  <!-- 玻璃 -->
  <rect x="8" y="8" width="184" height="128" rx="10" fill="url(#glass)"/>
  <path d="M12 12 Q12 70 12 132" stroke="#ffffff" stroke-width="2.4" opacity="0.5" fill="none"/>
  <rect x="4" y="136" width="192" height="12" rx="4" fill="#8d6f4e"/>
  <rect x="4" y="136" width="192" height="4" rx="2" fill="#a5825c"/>
</svg>
