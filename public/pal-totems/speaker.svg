<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
  <!-- 音箱：低音盆随节奏轻颤 -->
  <style>
    .woofer { transform-origin: 80px 140px; animation: pump 1.1s ease-in-out infinite alternate; }
    @keyframes pump { 0% { transform: scale(1); } 100% { transform: scale(1.045); } }
  </style>
  <defs>
    <linearGradient id="sbox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4147"/>
      <stop offset="0.5" stop-color="#4d555c"/>
      <stop offset="1" stop-color="#31373d"/>
    </linearGradient>
  </defs>
  <rect x="26" y="12" width="108" height="176" rx="12" fill="url(#sbox)"/>
  <rect x="34" y="20" width="92" height="160" rx="8" fill="none" stroke="#5c656d" stroke-width="2"/>
  <circle cx="80" cy="60" r="20" fill="#22282d"/>
  <circle cx="80" cy="60" r="12" fill="#39434b"/>
  <circle cx="80" cy="60" r="5" fill="#6b7680"/>
  <circle class="woofer" cx="80" cy="140" r="34" fill="#22282d"/>
  <circle cx="80" cy="140" r="22" fill="#39434b"/>
  <circle cx="80" cy="140" r="9" fill="#6b7680"/>
  <circle cx="80" cy="140" r="3" fill="#e8b74a"/>
  <rect x="60" y="26" width="40" height="4" rx="2" fill="#e8b74a" opacity="0.8"/>
</svg>
