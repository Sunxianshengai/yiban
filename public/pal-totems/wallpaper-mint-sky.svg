<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice">
  <!-- mint-sky：完整房间场景 v2（墙面板缝/墙角 AO/踢脚线分段+插座/拼板错缝/木纹/节疤），光照与家具呼应 -->
  <style>
    .st { animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .rain { animation: fall 1.6s linear infinite; }
    @keyframes fall { 0% { transform: translateY(-140px); } 100% { transform: translateY(0); } }
    .pt { animation: petal 8s linear infinite; }
    .pt.p2 { animation-duration: 10s; animation-delay: 2.6s; }
    .pt.p3 { animation-duration: 9s; animation-delay: 5s; }
    @keyframes petal { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translate(-60px, 420px) rotate(300deg); opacity: 0; } }
    .mist1 { animation: mbreath 9s ease-in-out infinite alternate; }
    .mist2 { animation: mbreath 12s ease-in-out infinite alternate; animation-delay: 2s; }
    @keyframes mbreath { 0% { opacity: 0.5; } 100% { opacity: 0.85; } }
  </style>
  <defs>
    <linearGradient id="wp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f3ec"/><stop offset="1" stop-color="#f4faf3"/>
    </linearGradient>
    <linearGradient id="wallGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a7a56" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="395" fill="url(#wp)"/>
  <circle cx="640" cy="100" r="46" fill="#ffeaa6" opacity="0.9"/><circle cx="640" cy="100" r="66" fill="#fff3c4" opacity="0.35"/>
      <g fill="#ffffff" opacity="0.9"><ellipse cx="170" cy="120" rx="110" ry="22"/><ellipse cx="250" cy="104" rx="70" ry="16"/></g>
      <g fill="#ffffff" opacity="0.7"><ellipse cx="470" cy="210" rx="130" ry="18"/><ellipse cx="560" cy="196" rx="70" ry="13"/></g>
  <!-- 墙面板接缝 + 两侧墙角 AO -->
  <line x1="160" y1="0" x2="160" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="320" y1="0" x2="320" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="480" y1="0" x2="480" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    <line x1="640" y1="0" x2="640" y2="388" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
  <rect width="16" height="388" fill="#0a1420" opacity="0.10"/>
  <rect x="784" width="16" height="388" fill="#0a1420" opacity="0.10"/>
  <rect width="800" height="395" fill="url(#wallGlow)"/>
  <!-- 墙脚 AO -->
  <rect y="368" width="800" height="20" fill="#0a1420" opacity="0.10"/>
  <!-- 踢脚线（分段缝+插座） -->
  <rect y="388" width="800" height="18" fill="#f0f2ec"/>
  <rect y="388" width="800" height="3" fill="#ffffff"/>
  <line x1="200" y1="391" x2="200" y2="403" stroke="#cdd0c2" stroke-width="1.6"/>
    <line x1="400" y1="391" x2="400" y2="403" stroke="#cdd0c2" stroke-width="1.6"/>
    <line x1="600" y1="391" x2="600" y2="403" stroke="#cdd0c2" stroke-width="1.6"/>
  <rect y="403" width="800" height="3" fill="#cdd0c2"/>
  <g>
      <rect x="648" y="392" width="14" height="11" rx="2" fill="#ffffff" stroke="#cdd0c2" stroke-width="1"/>
      <circle cx="652.6" cy="397.5" r="1.5" fill="#bcbfb0"/>
      <circle cx="657.4" cy="397.5" r="1.5" fill="#bcbfb0"/>
    </g>
  <!-- 地板：拼板线 + 行错缝 + 木纹 + 节疤 + 前缘压暗 -->
  <rect y="406" width="800" height="114" fill="#e2d3b2"/>
  <g><line x1="130" y1="406" x2="130" y2="520" stroke="#ccbb96" stroke-width="2.4"/>
    <line x1="268" y1="406" x2="268" y2="520" stroke="#ccbb96" stroke-width="2.4"/>
    <line x1="406" y1="406" x2="406" y2="520" stroke="#ccbb96" stroke-width="2.4"/>
    <line x1="544" y1="406" x2="544" y2="520" stroke="#ccbb96" stroke-width="2.4"/>
    <line x1="682" y1="406" x2="682" y2="520" stroke="#ccbb96" stroke-width="2.4"/></g>
  <g><line x1="200" y1="470" x2="200" y2="348" stroke="#ccbb96" stroke-width="2"/>
    <line x1="336" y1="412" x2="336" y2="492" stroke="#ccbb96" stroke-width="2"/>
    <line x1="612" y1="430" x2="612" y2="508" stroke="#ccbb96" stroke-width="2"/></g>
  <g><path d="M170 412 C164 436 176 458 170 480" stroke="#bca988" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M308 412 C302 436 314 458 308 480" stroke="#bca988" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M446 412 C440 436 452 458 446 480" stroke="#bca988" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M584 412 C578 436 590 458 584 480" stroke="#bca988" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M722 412 C716 436 728 458 722 480" stroke="#bca988" stroke-width="1" fill="none" opacity="0.55"/></g>
  <g><ellipse cx="168" cy="436" rx="7" ry="4.4" fill="#b09c76" opacity="0.6"/>
    <ellipse cx="168" cy="436" rx="3.4" ry="2" fill="#b09c76" opacity="0.8"/>
    <ellipse cx="306" cy="486" rx="7" ry="4.4" fill="#b09c76" opacity="0.6"/>
    <ellipse cx="306" cy="486" rx="3.4" ry="2" fill="#b09c76" opacity="0.8"/>
    <ellipse cx="578" cy="448" rx="7" ry="4.4" fill="#b09c76" opacity="0.6"/>
    <ellipse cx="578" cy="448" rx="3.4" ry="2" fill="#b09c76" opacity="0.8"/></g>
  <rect y="462" width="800" height="2.4" fill="#d5c6a4"/>
  <rect y="406" width="800" height="114" fill="url(#floorShade)"/>
</svg>
