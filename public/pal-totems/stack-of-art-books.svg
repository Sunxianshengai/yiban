<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 118">
  <!-- 艺术书堆：五本布面平放，几何封面 + 书页纹理 + 布纹颗粒（对齐原版五册配色） -->
  <defs>
    <filter id="cloth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.38  0 0 0 0 0.34  0 0 0 0.16 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <pattern id="pages" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#f4efe2"/>
      <rect y="2.4" width="4" height="0.6" fill="#d9d2bf"/>
    </pattern>
    <clipPath id="c1"><rect x="12" y="12" width="176" height="26"/></clipPath>
    <clipPath id="c3"><rect x="10" y="58" width="180" height="19"/></clipPath>
  </defs>

  <!-- 第5册（底）：米底 + 红块 + 藏青四分之一圆 -->
  <g>
    <rect x="8" y="92" width="184" height="20" fill="#e3dac7"/>
    <rect x="8" y="92" width="184" height="20" fill="#ffffff" filter="url(#cloth)"/>
    <rect x="30" y="92" width="66" height="20" fill="#b23a30"/>
    <path d="M160 112 A26 26 0 0 0 134 86 L160 86 Z" fill="#2c3648" clip-path="url(#c1)"/>
    <path d="M160 112 A26 26 0 0 0 134 86 L160 86 Z" fill="#2c3648" transform="translate(0,26)" clip-path="url(#c3)"/>
    <rect x="160" y="92" width="26" height="20" fill="url(#pages)" opacity="0"/>
  </g>

  <!-- 第4册：灰蓝 + 藏青块 + 米块 -->
  <g>
    <rect x="22" y="75" width="156" height="17" fill="#6e86a0"/>
    <rect x="22" y="75" width="156" height="17" fill="#ffffff" filter="url(#cloth)"/>
    <rect x="40" y="75" width="38" height="17" fill="#2c3648"/>
    <rect x="84" y="75" width="40" height="17" fill="#e3dac7"/>
    <rect x="146" y="77" width="26" height="13" fill="url(#pages)"/>
  </g>

  <!-- 第3册：红 + 米色半圆 -->
  <g>
    <rect x="10" y="58" width="180" height="17" fill="#b23a30"/>
    <rect x="10" y="58" width="180" height="17" fill="#ffffff" filter="url(#cloth)"/>
    <path d="M36 75 A26 26 0 0 1 88 75 Z" fill="#e8dfd0"/>
    <rect x="150" y="60" width="26" height="13" fill="url(#pages)"/>
    <rect x="10" y="58" width="180" height="2" fill="#8d2a24" opacity="0.5"/>
  </g>

  <!-- 第2册：藏青 + 米条 + 橙块 -->
  <g>
    <rect x="20" y="40" width="160" height="18" fill="#2c3648"/>
    <rect x="20" y="40" width="160" height="18" fill="#ffffff" filter="url(#cloth)"/>
    <rect x="42" y="44" width="62" height="10" fill="#e3dac7"/>
    <rect x="110" y="44" width="22" height="10" fill="#c96a3a"/>
    <rect x="150" y="42" width="24" height="14" fill="url(#pages)"/>
  </g>

  <!-- 第1册（顶）：厚本，米面 + 红方/藏青椭圆/芥末大圆，书页厚块 -->
  <g>
    <rect x="14" y="36" width="172" height="6" fill="url(#pages)"/>
    <rect x="12" y="12" width="176" height="24" fill="#eae2d3"/>
    <rect x="12" y="12" width="176" height="24" fill="#ffffff" filter="url(#cloth)"/>
    <g clip-path="url(#c1)">
      <rect x="18" y="12" width="34" height="18" fill="#b23a30"/>
      <ellipse cx="80" cy="20" rx="20" ry="11" fill="#2c3648"/>
      <circle cx="140" cy="34" r="30" fill="#c9962e"/>
      <path d="M64 12 L92 12 L74 36 L52 36 Z" fill="#eae2d3" opacity="0.85"/>
    </g>
    <rect x="12" y="12" width="6" height="24" fill="#c9bfa8"/>
    <rect x="182" y="12" width="6" height="24" fill="#c9bfa8"/>
    <rect x="12" y="34.4" width="176" height="1.6" fill="#b3a98f"/>
  </g>

  <!-- 层间阴影 + 底部落影 -->
  <rect x="8" y="110" width="184" height="2.6" rx="1.3" fill="#3c3428" opacity="0.22"/>
  <rect x="20" y="74" width="158" height="1.4" fill="#2b251c" opacity="0.18"/>
  <rect x="10" y="57" width="180" height="1.4" fill="#2b251c" opacity="0.18"/>
  <rect x="20" y="39" width="160" height="1.4" fill="#1d2230" opacity="0.28"/>
</svg>
