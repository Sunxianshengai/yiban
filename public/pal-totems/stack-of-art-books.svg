<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 118">
  <!-- 艺术书堆 v3（写实精修）：布面织纹+书脊烫金+书页渐变+层间 AO，左上主光 -->
  <defs>
    <pattern id="cloth" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="none"/>
      <circle cx="0.8" cy="0.8" r="0.45" fill="#000000" opacity="0.10"/>
      <circle cx="2.3" cy="2.3" r="0.45" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <pattern id="pages" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#f6f1e4"/>
      <rect y="2.4" width="4" height="0.6" fill="#d9d2bf"/>
    </pattern>
    <clipPath id="cTop"><rect x="12" y="12" width="176" height="24"/></clipPath>
    <clipPath id="cB5"><rect x="8" y="92" width="184" height="20"/></clipPath>
    <clipPath id="cB3"><rect x="10" y="58" width="180" height="17"/></clipPath>
  </defs>

  <!-- 第5册（底）：米布面 + 红块 + 藏青四分之一圆 -->
  <g>
    <rect x="8" y="92" width="184" height="20" fill="#e3dac7"/>
    <rect x="8" y="92" width="184" height="20" fill="url(#cloth)"/>
    <rect x="8" y="92" width="184" height="4" fill="#ffffff" opacity="0.28"/>
    <rect x="30" y="92" width="66" height="20" fill="#b23a30"/>
    <rect x="30" y="92" width="66" height="20" fill="url(#cloth)" opacity="0.6"/>
    <g clip-path="url(#cB5)">
      <path d="M160 116 A26 26 0 0 0 134 90 L160 90 Z" fill="#2c3648"/>
      <path d="M160 98 A18 12 0 0 0 146 94" stroke="#c9a24b" stroke-width="1" fill="none" opacity="0.7"/>
    </g>
    <rect x="160" y="94" width="26" height="16" fill="url(#pages)"/>
    <rect x="8" y="110" width="184" height="2" fill="#3c3428" opacity="0.3"/>
  </g>

  <!-- 第4册：灰蓝 + 藏青块 + 米块 -->
  <g>
    <rect x="22" y="75" width="156" height="17" fill="#6e86a0"/>
    <rect x="22" y="75" width="156" height="17" fill="url(#cloth)"/>
    <rect x="22" y="75" width="156" height="3.4" fill="#ffffff" opacity="0.3"/>
    <rect x="40" y="75" width="38" height="17" fill="#2c3648"/>
    <rect x="84" y="75" width="40" height="17" fill="#e3dac7"/>
    <rect x="146" y="77" width="26" height="13" fill="url(#pages)"/>
    <rect x="22" y="90" width="156" height="2" fill="#3c3428" opacity="0.3"/>
  </g>

  <!-- 第3册：红 + 米色半圆（烫金弧线） -->
  <g>
    <rect x="10" y="58" width="180" height="17" fill="#b23a30"/>
    <rect x="10" y="58" width="180" height="17" fill="url(#cloth)"/>
    <rect x="10" y="58" width="180" height="3.4" fill="#ffffff" opacity="0.28"/>
    <g clip-path="url(#cB3)">
      <path d="M36 75 A26 26 0 0 1 88 75 Z" fill="#e8dfd0"/>
      <path d="M38 71 A24 20 0 0 1 86 71" stroke="#c9a24b" stroke-width="1.1" fill="none" opacity="0.75"/>
    </g>
    <rect x="150" y="60" width="26" height="13" fill="url(#pages)"/>
    <rect x="10" y="58" width="180" height="2" fill="#7d241f" opacity="0.55"/>
    <rect x="10" y="73" width="180" height="2" fill="#3c3428" opacity="0.28"/>
  </g>

  <!-- 第2册：藏青 + 米条 + 橙块 -->
  <g>
    <rect x="20" y="40" width="160" height="18" fill="#2c3648"/>
    <rect x="20" y="40" width="160" height="18" fill="url(#cloth)"/>
    <rect x="20" y="40" width="160" height="3.6" fill="#ffffff" opacity="0.26"/>
    <rect x="42" y="44" width="62" height="10" fill="#e3dac7"/>
    <rect x="110" y="44" width="22" height="10" fill="#c96a3a"/>
    <rect x="150" y="42" width="24" height="14" fill="url(#pages)"/>
    <rect x="20" y="56" width="160" height="2" fill="#101820" opacity="0.35"/>
  </g>

  <!-- 第1册（顶）：厚本米布面 + 几何封面（红方/藏青椭圆/芥末大圆）+ 书脊烫金框 -->
  <g>
    <rect x="14" y="36" width="172" height="7" fill="url(#pages)"/>
    <rect x="14" y="40" width="172" height="1.4" fill="#c9c0a8"/>
    <rect x="12" y="12" width="176" height="24" fill="#eae2d3"/>
    <rect x="12" y="12" width="176" height="24" fill="url(#cloth)"/>
    <rect x="12" y="12" width="176" height="4" fill="#ffffff" opacity="0.4"/>
    <g clip-path="url(#cTop)">
      <rect x="18" y="12" width="34" height="18" fill="#b23a30"/>
      <ellipse cx="80" cy="20" rx="20" ry="11" fill="#2c3648"/>
      <circle cx="140" cy="34" r="30" fill="#c9962e"/>
      <rect x="66" y="14" width="34" height="20" fill="none" stroke="#c9a24b" stroke-width="1" opacity="0.8"/>
    </g>
    <rect x="12" y="12" width="6" height="24" fill="#c9bfa8"/>
    <rect x="12" y="12" width="2" height="24" fill="#efe8d8"/>
    <rect x="182" y="12" width="6" height="24" fill="#c9bfa8"/>
    <rect x="12" y="34.4" width="176" height="1.6" fill="#b3a98f"/>
  </g>

  <!-- 层间 AO -->
  <rect x="8" y="110" width="184" height="2.6" rx="1.3" fill="#3c3428" opacity="0.26"/>
  <rect x="22" y="90" width="156" height="1.6" fill="#2b251c" opacity="0.2"/>
  <rect x="10" y="73" width="180" height="1.4" fill="#2b251c" opacity="0.18"/>
  <rect x="20" y="56" width="160" height="1.6" fill="#1d2230" opacity="0.3"/>
</svg>
