<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">
  <!-- 壁炉：砖砌炉膛+火焰摇曳动画 -->
  <style>
    .fl { transform-origin: 130px 168px; animation: flick 1.3s ease-in-out infinite alternate; }
    .fl.f2 { animation-duration: 1s; animation-delay: 0.3s; transform-origin: 116px 172px; }
    .fl.f3 { animation-duration: 1.6s; animation-delay: 0.15s; transform-origin: 146px 170px; }
    @keyframes flick { 0% { transform: scaleY(0.85) scaleX(1.05); } 100% { transform: scaleY(1.12) scaleX(0.94); } }
  </style>
  <defs>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a72"/>
      <stop offset="1" stop-color="#a56a55"/>
    </linearGradient>
    <pattern id="bricks" width="46" height="22" patternUnits="userSpaceOnUse">
      <rect width="46" height="22" fill="none"/>
      <rect x="1" y="1" width="21" height="9" rx="1.5" fill="#d08a70" opacity="0.5"/>
      <rect x="24" y="1" width="21" height="9" rx="1.5" fill="#b97158" opacity="0.5"/>
      <rect x="12" y="12" width="21" height="9" rx="1.5" fill="#c47f66" opacity="0.5"/>
    </pattern>
    <radialGradient id="hearthGlow" cx="0.5" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#ff9d4d" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#c7501f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b2320" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="240" height="26" rx="4" fill="url(#brick)"/>
  <rect x="22" y="36" width="216" height="160" fill="url(#brick)"/>
  <rect x="22" y="36" width="216" height="160" fill="url(#bricks)" opacity="0.55"/>
  <g stroke="#96543f" stroke-width="2" opacity="0.6">
    <line x1="22" y1="80" x2="238" y2="80"/><line x1="22" y1="124" x2="238" y2="124"/><line x1="22" y1="168" x2="238" y2="168"/>
    <line x1="90" y1="36" x2="90" y2="80"/><line x1="170" y1="36" x2="170" y2="80"/>
    <line x1="130" y1="80" x2="130" y2="124"/><line x1="60" y1="124" x2="60" y2="168"/><line x1="200" y1="124" x2="200" y2="168"/>
  </g>
  <rect x="62" y="96" width="136" height="100" rx="8" fill="#2b2320"/>
  <rect x="62" y="96" width="136" height="100" rx="8" fill="url(#hearthGlow)"/>
  <!-- 柴堆 -->
  <rect x="92" y="172" width="76" height="10" rx="5" fill="#7c5836"/>
  <rect x="100" y="164" width="60" height="10" rx="5" fill="#8d6a44" transform="rotate(-4 130 169)"/>
  <!-- 火焰（三簇摇曳） -->
  <g class="fl"><path d="M130 120 C114 140 118 158 130 168 C142 158 146 140 130 120 Z" fill="#f2913d"/></g>
  <g class="fl f2"><path d="M116 136 C106 150 110 162 118 170 C126 162 126 148 116 136 Z" fill="#e05f2c"/></g>
  <g class="fl f3"><path d="M146 134 C138 148 140 162 148 170 C156 162 156 146 146 134 Z" fill="#f7c04a"/></g>
  <!-- 炉台 -->
  <rect x="6" y="192" width="248" height="16" rx="4" fill="#8d6f4e"/>
  <rect x="6" y="192" width="248" height="5" rx="2" fill="#a5825c"/>
</svg>
