<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice">
  <!-- 星空夜幕：深蓝渐变+月亮+眨眼星星 -->
  <style>
    .st { animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="0.7" stop-color="#1f3055"/>
      <stop offset="1" stop-color="#2c3f66"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#efe4bd"/>
    </radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#nsky)"/>
  <circle cx="620" cy="120" r="44" fill="url(#moon)"/>
  <circle cx="606" cy="110" r="7" fill="#e3d6a8" opacity="0.7"/>
  <circle cx="632" cy="132" r="5" fill="#e3d6a8" opacity="0.6"/>
  <g fill="#ffffff">
    <circle class="st" cx="80" cy="70" r="2.4"/>
    <circle class="st" cx="180" cy="140" r="1.8" style="animation-delay:0.4s"/>
    <circle class="st" cx="300" cy="60" r="2.2" style="animation-delay:1.1s"/>
    <circle class="st" cx="420" cy="120" r="1.6" style="animation-delay:1.8s"/>
    <circle class="st" cx="500" cy="50" r="2.6" style="animation-delay:0.7s"/>
    <circle class="st" cx="700" cy="220" r="2" style="animation-delay:2.1s"/>
    <circle class="st" cx="120" cy="240" r="1.7" style="animation-delay:1.4s"/>
    <circle class="st" cx="240" cy="210" r="2.3" style="animation-delay:2.4s"/>
    <circle class="st" cx="360" cy="180" r="1.5" style="animation-delay:0.2s"/>
    <circle class="st" cx="470" cy="250" r="1.9" style="animation-delay:1.9s"/>
    <circle class="st" cx="60" cy="170" r="1.6" style="animation-delay:2.8s"/>
    <circle class="st" cx="740" cy="80" r="2.1" style="animation-delay:0.9s"/>
  </g>
  <ellipse cx="200" cy="330" rx="200" ry="18" fill="#2a3c63" opacity="0.8"/>
  <ellipse cx="600" cy="380" rx="240" ry="20" fill="#31446e" opacity="0.7"/>
</svg>
