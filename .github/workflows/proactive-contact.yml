name: Proactive contact scheduler
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: proactive-contact-production
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check due conversations
        env:
          PROACTIVE_CRON_SECRET: ${{ secrets.PROACTIVE_CRON_SECRET }}
        run: |
          test -n "$PROACTIVE_CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 115 \
            --request POST --header "Authorization: Bearer $PROACTIVE_CRON_SECRET" \
            https://yiban-memory.eu.cc/api/proactive/run
